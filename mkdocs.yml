          - PXE & DHCP Staging: provisioning/01-pre-provisioning/pxe-dhcp-setup.md
      - 2. OS Provisioning:
          - Kickstart Execution & Validation: provisioning/02-provisioning/kickstart-execution.md
      - 3. Base OS & Hardening:
          - Overview: provisioning/03-post-install-base/index.md
          - CIS Benchmark: provisioning/03-post-install-base/cis-hardening.md
          - Kernel & Repositories: provisioning/03-post-install-base/repos-kernel.md
          - FreeIPA / IDM & SSSD: provisioning/03-post-install-base/idm-sssd.md
          - Security, Auditd & Syslog: provisioning/03-post-install-base/security-syslog.md
      - 4. Network Migration:
          - Overview: provisioning/04-network-migration/index.md
          - App Server Network: provisioning/04-network-migration/app-server.md
          - DB Server Network: provisioning/04-network-migration/db-server.md
